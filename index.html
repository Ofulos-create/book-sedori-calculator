<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>本せどり計算機</title><style>
:root{--bg:#f7f5f1;--card:#fffdf9;--ink:#39423f;--muted:#76817c;--mint:#dcebe3;--blue:#dfe9f3;--peach:#f4e2d6;--lav:#e9e2f0;--line:#dedfd9;--done:#e3eadf;--accent:#698579}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}.title{text-align:center;font-size:24px;margin:8px 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 3px 14px #00000008}.buy{border-top:7px solid var(--mint)}.sell{border-top:7px solid var(--peach)}h2{font-size:19px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input,select,button{width:100%;font:inherit;border-radius:11px;border:1px solid #cfd4d0;padding:12px;background:white;color:var(--ink)}input:focus,select:focus{outline:2px solid #c8ddd3;border-color:transparent}.result{background:#f0f4f1;border-radius:13px;padding:13px;margin:12px 0;text-align:center}.result b{font-size:24px}.btn{border:0;background:var(--accent);color:white;font-weight:700;margin-top:8px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sum{padding:12px;border-radius:14px;text-align:center;background:var(--blue)}.sum:nth-child(2){background:var(--lav)}.sum:nth-child(3){background:var(--peach)}.sum:nth-child(4){background:var(--mint)}.sum:nth-child(5){background:#f1eadf}.sum:nth-child(6){background:#e8eef0}.sum small{display:block;color:var(--muted)}.sum b{font-size:19px}.tabs{display:flex;gap:8px;margin:15px 0}.export-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.export-actions button{background:#f5f2fa}.export-actions button:first-child{background:#eef5f1}.tabs button{background:white}.tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}.item{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.item.done{background:var(--done);opacity:.78}.item-head{display:flex;justify-content:space-between;gap:8px;align-items:start}.name{font-weight:700}.meta{font-size:13px;color:#66706c;line-height:1.65;margin-top:7px}.profit{font-weight:800;font-size:18px}.actions{display:flex;gap:7px;margin-top:9px}.actions button{padding:8px;font-size:13px}.donebtn{background:#edf3ef}.del{background:#fff0ee}.empty{text-align:center;color:var(--muted);padding:22px}.note{font-size:12px;color:var(--muted);line-height:1.5}.custom{margin-top:7px;display:none}@media(max-width:420px){.wrap{padding:11px}.card{padding:14px}.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}
</style></head><body><div class='wrap'><h1 class='title'>📚 本せどり計算機</h1>
<section class='card buy'><h2>仕入計算</h2><div class='grid'><div class='field'><label>仕入価格（合計）</label><input id='buyPrice' type='number' min='0' inputmode='numeric' placeholder='例 3960'></div><div class='field'><label>冊数</label><input id='buyCount' type='number' min='1' inputmode='numeric' placeholder='例 80'></div></div><div class='result'>1冊単価<br><b id='unitResult'>— 円</b></div><div class='field'><label>商品名</label><input id='buyName' placeholder='例 児童書80冊セット'></div><button class='btn' id='saveBuy'>仕入一覧に保存</button></section>
<section class='card sell'><h2>販売計算</h2><div class='grid'><div class='field'><label>1冊単価</label><input id='sellUnit' type='number' min='0' step='0.01' inputmode='decimal' placeholder='例 49.5'></div><div class='field'><label>冊数</label><input id='sellCount' type='number' min='1' inputmode='numeric' placeholder='例 20'></div></div><div class='result'>原価<br><b id='costResult'>— 円</b></div><div class='grid'><div class='field'><label>販売手数料</label><select id='feeRate'></select></div><div class='field'><label>送料</label><select id='shipping'><option value='160'>ゆうパケットポストmini 160円</option><option value='215'>ゆうパケットポスト 215円</option><option value='230'>ゆうパケット 230円</option><option value='455'>ゆうパケットプラス 455円</option><option value='750'>ゆうパック60 750円</option><option value='870' selected>ゆうパック80 870円</option><option value='1070'>ゆうパック100 1,070円</option><option value='1200'>ゆうパック120 1,200円</option><option value='1450'>ゆうパック140 1,450円</option><option value='1700'>ゆうパック160 1,700円</option><option value='1900'>ゆうパック170 1,900円</option></select></div></div><div class='field'><label>資材費</label><select id='material'><option value='20'>ゆうパケットポストmini 20円</option><option value='19'>ゆうパケットポスト 19円</option><option value='55' selected>B4紙袋 55円</option><option value='65'>ゆうパケットプラス箱 65円</option><option value='custom'>自由入力</option></select><input class='custom' id='customMaterial' type='number' min='0' inputmode='numeric' placeholder='資材費を入力'></div><div class='result'>利益0円（限界売価）<br><b id='breakEvenResult'>— 円</b></div><div class='grid'><div class='result'>利益500円<br><b id='profit500Result'>— 円</b></div><div class='result'>利益1,000円<br><b id='profit1000Result'>— 円</b></div></div><div class='field'><label>販売価格</label><input id='salePrice' type='number' min='0' inputmode='numeric' placeholder='例 5000'></div><div class='result'>販売利益<br><b id='profitResult'>— 円</b><div class='note' id='profitDetail'></div></div><div class='field'><label>商品名</label><input id='sellName' placeholder='例 サバイバルシリーズ20冊'></div><button class='btn' id='saveSell'>販売一覧に保存</button></section>
<section class='card'><h2>保存データ集計</h2><div class='summary'><div class='sum'><small>仕入総額</small><b id='totalBuy'>0円</b></div><div class='sum'><small>販売総額</small><b id='totalSales'>0円</b></div><div class='sum'><small>経費総額</small><b id='totalExpenses'>0円</b></div><div class='sum'><small>総粗利益額</small><b id='totalGrossProfit'>0円</b></div><div class='sum'><small>総利益額</small><b id='totalProfit'>0円</b></div><div class='sum'><small>利益率</small><b id='totalProfitRate'>—%</b></div></div><div class='export-actions'><button id='copyData'>一覧をコピー</button><button id='exportCsv'>CSV出力</button></div><div class='tabs'><button id='buyTab' class='active'>仕入一覧</button><button id='sellTab'>販売一覧</button></div><div class='note'>「一覧をコピー」「CSV出力」は現在表示している仕入／販売一覧を対象にします。</div><div id='list'></div></section>
</div><script>
const $=id=>document.getElementById(id), yen=n=>Math.round(Number(n)||0).toLocaleString('ja-JP')+'円';
for(let i=5;i<=15;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'%';if(i===10)o.selected=true;$('feeRate').appendChild(o)}
let buys=JSON.parse(localStorage.getItem('book-resell-buys-v1')||'[]'), sells=JSON.parse(localStorage.getItem('book-resell-sells-v1')||'[]'), tab='buy';
function unit(){let p=+$('buyPrice').value,c=+$('buyCount').value;let v=c>0?p/c:0;$('unitResult').textContent=c>0?(Number.isInteger(v)?yen(v):v.toFixed(2)+'円'):'— 円';return v}
function material(){return $('material').value==='custom'?+$('customMaterial').value:+$('material').value}
function calcSell(){let u=+$('sellUnit').value,c=+$('sellCount').value,cost=u*c,price=+$('salePrice').value,rate=+$('feeRate').value/100,ship=+$('shipping').value,mat=material(),fee=price*rate,profit=price-fee-cost-ship-mat,valid=u>=0&&c>0&&rate<1,breakEven=valid?Math.ceil((cost+ship+mat)/(1-rate)):0,price500=valid?Math.ceil((cost+ship+mat+500)/(1-rate)):0,price1000=valid?Math.ceil((cost+ship+mat+1000)/(1-rate)):0;$('costResult').textContent=valid?yen(cost):'— 円';$('breakEvenResult').textContent=valid?yen(breakEven):'— 円';$('profit500Result').textContent=valid?yen(price500):'— 円';$('profit1000Result').textContent=valid?yen(price1000):'— 円';$('profitResult').textContent=price?yen(profit):'— 円';$('profitDetail').textContent=price?'手数料 '+yen(fee)+'・送料 '+yen(ship)+'・資材 '+yen(mat):'';return{cost,price,rate,ship,mat,fee,profit,breakEven}}
['buyPrice','buyCount'].forEach(x=>$(x).addEventListener('input',unit));['sellUnit','sellCount','feeRate','shipping','material','customMaterial','salePrice'].forEach(x=>$(x).addEventListener('input',calcSell));$('material').addEventListener('change',()=>{$('customMaterial').style.display=$('material').value==='custom'?'block':'none';calcSell()});
$('saveBuy').onclick=()=>{let price=+$('buyPrice').value,count=+$('buyCount').value,name=$('buyName').value.trim();if(!price||!count||!name)return alert('仕入価格・冊数・商品名を入力してください。');buys.unshift({id:Date.now(),name,price,count,unit:price/count,done:false});save();$('buyPrice').value='';$('buyCount').value='';$('buyName').value='';unit()};
$('saveSell').onclick=()=>{let name=$('sellName').value.trim(),u=+$('sellUnit').value,c=+$('sellCount').value,x=calcSell();if(!name||!u||!c||!x.price)return alert('1冊単価・冊数・販売価格・商品名を入力してください。');sells.unshift({id:Date.now(),name,unit:u,count:c,...x,feeRate:+$('feeRate').value,shippingText:$('shipping').selectedOptions[0].text,materialText:$('material').value==='custom'?'自由入力':$('material').selectedOptions[0].text,profitRate:x.price>0?(x.profit/x.price*100):0,done:false});save();$('sellName').value='';$('sellUnit').value='';$('sellCount').value='';$('salePrice').value='';calcSell()};
function save(){localStorage.setItem('book-resell-buys-v1',JSON.stringify(buys));localStorage.setItem('book-resell-sells-v1',JSON.stringify(sells));render()}
function render(){let tb=buys.reduce((a,x)=>a+x.price,0),ts=sells.reduce((a,x)=>a+x.price,0),te=sells.reduce((a,x)=>a+x.fee+x.ship+x.mat,0),tp=sells.reduce((a,x)=>a+x.profit,0);$('totalBuy').textContent=yen(tb);$('totalSales').textContent=yen(ts);$('totalExpenses').textContent=yen(te);$('totalGrossProfit').textContent=yen(tp);let netProfit=tp-tb;$('totalProfit').textContent=yen(netProfit);$('totalProfitRate').textContent=ts>0?(netProfit/ts*100).toFixed(1)+'%':'—%';let arr=tab==='buy'?buys:sells;if(!arr.length){$('list').innerHTML='<div class="empty">まだ保存データがありません</div>';return}$('list').innerHTML=arr.map(x=>tab==='buy'?`<div class="item ${x.done?'done':''}"><div class="item-head"><div class="name">${esc(x.name)}</div><b>${yen(x.price)}</b></div><div class="meta">${x.count}冊 ／ 1冊単価 ${yen(x.unit)}</div><div class="actions"><button class="donebtn" onclick="toggle('buy',${x.id})">${x.done?'未処理に戻す':'処理済み'}</button><button class="del" onclick="removeItem('buy',${x.id})">削除</button></div></div>`:`<div class="item ${x.done?'done':''}"><div class="item-head"><div class="name">${esc(x.name)}</div><div class="profit">利益 ${yen(x.profit)}</div></div><div class="meta">販売 ${yen(x.price)} ／ 原価 ${yen(x.cost)}<br>${x.count}冊・単価 ${yen(x.unit)} ／ 手数料 ${x.feeRate}%（${yen(x.fee)}）<br>${esc(x.shippingText)} ／ 資材 ${yen(x.mat)}<br>限界売価 ${yen(x.breakEven||0)} ／ 利益率 ${Number(x.profitRate??(x.price?x.profit/x.price*100:0)).toFixed(1)}%</div><div class="actions"><button class="donebtn" onclick="toggle('sell',${x.id})">${x.done?'未処理に戻す':'処理済み'}</button><button class="del" onclick="removeItem('sell',${x.id})">削除</button></div></div>`).join('')}

function csvEscape(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function rowsForCurrent(){
 if(tab==='buy') return [['商品名','仕入価格','冊数','1冊単価','状態'],...buys.map(x=>[x.name,Math.round(x.price),x.count,Number(x.unit.toFixed(2)),x.done?'処理済み':'未処理'])];
 return [['商品名','販売価格','冊数','1冊単価','原価','手数料率','手数料','送料','資材費','経費合計','限界売価','利益','利益率','状態'],...sells.map(x=>[x.name,Math.round(x.price),x.count,Number(x.unit.toFixed(2)),Math.round(x.cost),x.feeRate+'%',Math.round(x.fee),Math.round(x.ship),Math.round(x.mat),Math.round(x.fee+x.ship+x.mat),Math.round(x.breakEven||0),Math.round(x.profit),Number(x.profitRate??(x.price?x.profit/x.price*100:0)).toFixed(1)+'%',x.done?'処理済み':'未処理'])];
}
$('copyData').onclick=async()=>{let rows=rowsForCurrent(), text=rows.map(r=>r.join('\t')).join('\n');try{await navigator.clipboard.writeText(text);alert((tab==='buy'?'仕入':'販売')+'一覧をコピーしました。Excelやスプレッドシートに貼り付けできます。')}catch(e){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('一覧をコピーしました。')}};
$('exportCsv').onclick=()=>{let rows=rowsForCurrent(),csv='\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(tab==='buy'?'仕入一覧':'販売一覧')+'_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}window.toggle=(t,id)=>{let a=t==='buy'?buys:sells,x=a.find(v=>v.id===id);if(x)x.done=!x.done;save()};window.removeItem=(t,id)=>{if(!confirm('この項目を削除しますか？'))return;if(t==='buy')buys=buys.filter(x=>x.id!==id);else sells=sells.filter(x=>x.id!==id);save()};$('buyTab').onclick=()=>{tab='buy';$('buyTab').classList.add('active');$('sellTab').classList.remove('active');render()};$('sellTab').onclick=()=>{tab='sell';$('sellTab').classList.add('active');$('buyTab').classList.remove('active');render()};unit();calcSell();render();
</script></body></html>
